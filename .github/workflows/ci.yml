name: Track B smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog
      - name: Install Python test dependency
        run: python -m pip install cocotb==1.9.2
      - name: Lint and Track B smoke
        run: make lint smoke
